# Builds the plugin DLL from source on every push and pull request.
# The KeePass.exe reference comes from the official KeePass ZIP, verified by SHA-256
# (hash published at https://keepass.info/integrity.html).
# Actions are pinned to full commit SHAs (required by the RamzX org policy).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KEEPASS_VERSION: '2.60'
  KEEPASS_SHA256: '63872830ae78a0e9075cd32b61693ce1e719929b3124e4987b1f3dc42f31da74'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Download and verify KeePass (build reference only)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\KeePass.zip"
          $url = "https://sourceforge.net/projects/keepass/files/KeePass%202.x/$env:KEEPASS_VERSION/KeePass-$env:KEEPASS_VERSION.zip/download"
          curl.exe -sSL --fail --retry 3 -o $zip $url
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:KEEPASS_SHA256) { throw "KeePass ZIP hash mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\KeePass"
          "KEEPASS_DIR=$env:RUNNER_TEMP\KeePass\" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: pwsh
        run: dotnet build src/RamzXUnlock/RamzXUnlock.csproj -c Release "/p:KeePassDir=$env:KEEPASS_DIR"

      - name: Test
        shell: pwsh
        run: >
          dotnet test tests/RamzXUnlock.Tests/RamzXUnlock.Tests.csproj -c Release
          "/p:KeePassDir=$env:KEEPASS_DIR"
          --collect:"XPlat Code Coverage" --results-directory "$env:RUNNER_TEMP/coverage"

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: ./build/coverage-summary.ps1 "$env:RUNNER_TEMP/coverage" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Tag matches the plugin version (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $want = $env:GITHUB_REF_NAME.Substring(1)
          foreach ($f in Get-ChildItem src -Recurse -Filter 'RamzX*.dll' | Where-Object FullName -like '*\bin\Release\net48\*') {
            $v = [Version](Get-Item $f.FullName).VersionInfo.FileVersion
            $have = '{0}.{1}.{2}' -f $v.Major, $v.Minor, $v.Build
            if ($have -ne $want) { throw "$($f.Name) is $have, tag is $env:GITHUB_REF_NAME" }
          }

      - name: Upload plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RamzXUnlock
          path: |
            src/RamzXUnlock/bin/Release/net48/RamzXUnlock.dll
            LICENSE
            README.md
          if-no-files-found: error

  # A tag vX.Y.Z builds on GitHub's runners and uploads the plugin as a DRAFT release (GitHub API): nobody sees it
  # until the owner checks and publishes it. The signed version file (ramzx.de/plugins/version.txt) is made on the
  # release machine afterwards (RamzX Tools: tools/Sign-VersionFile.ps1) - the private key never goes to GitHub.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the draft release
      id-token: write      # Sigstore signing of the build provenance
      attestations: write
    steps:
      - name: Plugin files from the build job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RamzXUnlock
          path: build-output

      - name: Collect files and checksums
        run: |
          mkdir dist
          find build-output -name 'RamzX*.dll' -exec cp {} dist/ \;
          cp build-output/LICENSE build-output/README.md dist/ 2>/dev/null || true
          cd dist && sha256sum *.dll > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Build provenance (public repositories)
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dll

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "RamzX Unlock ${GITHUB_REF_NAME#v}" \
            --notes "Copy the DLL file(s) into the Plugins folder of KeePass (2.60 or newer) and restart KeePass. Checksums: SHA256SUMS.txt."
