<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">How Miftawerk Unlock works</title>
  <desc id="d">1. Open KeePass with your master password. 2. Enable Windows Hello for this database. 3. Next time unlock with face, fingerprint or PIN. 4. After 7 days or a Windows restart the master password is required again.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#0f172a"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(150 0)">
      <circle cx="0" cy="105" r="46" fill="none" stroke="url(#g)" stroke-width="5"/>
      <text x="0" y="118" font-size="38" fill="#e2e8f0">🔑</text>
      <text x="0" y="195" font-size="22" font-weight="600" fill="#f8fafc">1. Master password</text>
      <text x="0" y="225" font-size="17" fill="#94a3b8">Open the database</text>
      <text x="0" y="248" font-size="17" fill="#94a3b8">once as usual</text>
    </g>
    <g transform="translate(450 0)">
      <circle cx="0" cy="105" r="46" fill="none" stroke="url(#g)" stroke-width="5"/>
      <text x="0" y="118" font-size="38" fill="#e2e8f0">✅</text>
      <text x="0" y="195" font-size="22" font-weight="600" fill="#f8fafc">2. Enable</text>
      <text x="0" y="225" font-size="17" fill="#94a3b8">Opt-in per database,</text>
      <text x="0" y="248" font-size="17" fill="#94a3b8">key stays in the TPM</text>
    </g>
    <g transform="translate(750 0)">
      <circle cx="0" cy="105" r="46" fill="none" stroke="url(#g)" stroke-width="5"/>
      <text x="0" y="118" font-size="38" fill="#e2e8f0">👆</text>
      <text x="0" y="195" font-size="22" font-weight="600" fill="#f8fafc">3. Windows Hello</text>
      <text x="0" y="225" font-size="17" fill="#94a3b8">Face, fingerprint or PIN</text>
      <text x="0" y="248" font-size="17" fill="#94a3b8">opens KeePass</text>
    </g>
    <g transform="translate(1050 0)">
      <circle cx="0" cy="105" r="46" fill="none" stroke="url(#g)" stroke-width="5"/>
      <text x="0" y="118" font-size="38" fill="#e2e8f0">⏱️</text>
      <text x="0" y="195" font-size="22" font-weight="600" fill="#f8fafc">4. Auto-expiry</text>
      <text x="0" y="225" font-size="17" fill="#94a3b8">After 7 days or a</text>
      <text x="0" y="248" font-size="17" fill="#94a3b8">Windows restart</text>
    </g>
  </g>
  <g stroke="#94a3b8" stroke-width="3" marker-end="url(#a)">
    <line x1="210" y1="105" x2="390" y2="105"/>
    <line x1="510" y1="105" x2="690" y2="105"/>
    <line x1="810" y1="105" x2="990" y2="105"/>
  </g>
</svg>
